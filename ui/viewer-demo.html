<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>눈길 PDF Renderer Demo</title>

  <style>
    body {
      margin: 0;
      background: #eef2f7;
      font-family: sans-serif;
    }

    .demo-toolbar {
      height: 56px;
      background: white;
      border-bottom: 1px solid #dbe4f0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    #pageCanvas {
      min-height: calc(100vh - 56px);
      padding: 32px;
      overflow: auto;
    }

    .dropzone {
      border: 2px dashed #9bb7e8;
      border-radius: 20px;
      background: white;
      padding: 60px;
      text-align: center;
      color: #64748b;
      font-weight: 700;
    }

    .pdf-page-wrapper {
      position: relative;
      margin: 0 auto 28px;
      width: fit-content;
    }

    .pdf-page {
      display: block;
      background: white;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.18);
    }

    .pdf-page-num {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      padding-top: 8px;
    }

    .pdf-loading,
    .pdf-no-content {
      text-align: center;
      padding: 80px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="demo-toolbar">
    <strong>눈길 PDF Renderer Demo</strong>
    <button id="zoomOutBtn">−</button>
    <span id="zoomLevel">100%</span>
    <button id="zoomInBtn">+</button>
  </div>

  <main id="pageCanvas">
    <div id="dropzone" class="dropzone">
      PDF 파일을 여기에 드래그하세요
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script type="module">
    import {
      initPdfRenderer,
      renderPdf,
      zoomIn,
      zoomOut,
    } from "./viewer/pdfRenderer.js";

    await initPdfRenderer({
      containerId: "pageCanvas",
      zoomLabelId: "zoomLevel",
    });

    const pageCanvas = document.getElementById("pageCanvas");

    ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    });

    pageCanvas.addEventListener("drop", async (e) => {
      e.preventDefault();
      e.stopPropagation();

      const file = e.dataTransfer.files?.[0];
      if (!file) return;

      if (!file.name.toLowerCase().endsWith(".pdf")) {
        alert("PDF만 테스트할 수 있어요.");
        return;
      }

      const url = URL.createObjectURL(file);
      await renderPdf(url);
    });

    document.getElementById("zoomInBtn").addEventListener("click", zoomIn);
    document.getElementById("zoomOutBtn").addEventListener("click", zoomOut);
  </script>
</body>
</html>
