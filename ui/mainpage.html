<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>눈길 메인페이지</title>

  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    body {
      min-height: 100vh;
      color: #1d2b4f;
      background:
        radial-gradient(ellipse 75% 55% at 10% 0%, #a8c8ff 0%, transparent 60%),
        radial-gradient(ellipse 65% 50% at 90% 0%, #93b8fa 0%, transparent 60%),
        #f8faff;
      overflow-x: hidden;

      display: flex;
      justify-content: center;
    }

    button {
      font-family: inherit;
    }

    .container {
      width: 100%;
      max-width: 1040px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 20px 36px;

      display: flex;
      flex-direction: column;

      transition:
        width 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        max-width 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        margin-left 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        margin-right 0.48s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: width, max-width, margin-left;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 420;
      color: #1e2d52;
      letter-spacing: -0.2px;
    }

    .nav-button {
      padding: 9px 16px;
      border: none;
      border-radius: 999px;
      background: #1f2f57;
      color: white;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(31, 47, 87, 0.14);
      transition: 0.2s ease;
    }

    .nav-button:hover {
      transform: translateY(-1px);
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-bottom: 24px;
      will-change: transform;
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(59, 130, 246, 0.14);
      color: #3562bd;
      font-size: 11.5px;
      font-weight: 450;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .hero p {
      font-size: 14px;
      font-weight: 450;
      color: #7b8496;
      line-height: 1.55;
      margin-bottom: 5px;
    }

    .hero h1 {
      font-size: clamp(25px, 2.6vw, 32px);
      line-height: 1.32;
      letter-spacing: -1.1px;
      font-weight: 450;
      max-width: 820px;
      margin-bottom: 12px;
      color: #202b49;
    }

    .hero h1 .highlight {
      color: #5f86ea;
      font-weight: 500;
    }

    .upload-card {
      width: 100%;
      max-width: 640px;
      min-height: 225px;
      background: rgba(255, 255, 255, 0.46);
      border: 1.5px solid rgba(111, 163, 239, 0.16);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 12px 28px rgba(117, 154, 214, 0.045);
      backdrop-filter: blur(14px);
      transition: 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      margin-top: 18px;
    }

    .upload-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(111, 163, 239, 0.1);
    }

    .upload-inner {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-align: center;
    }

    .upload-icon {
      width: 42px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6fa3ef;
    }

    .upload-icon svg {
      width: 100%;
      height: 100%;
    }

    .upload-icon svg path {
      stroke-width: 3.4;
    }

    .upload-title {
      font-size: 16px;
      font-weight: 550;
      color: #22345e;
      letter-spacing: -0.25px;
      margin: 0 0 2px 0;
    }

    .upload-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 128px;
      height: 36px;
      padding: 0 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, #8bb5f6 0%, #73a2f0 100%);
      color: white;
      font-size: 13.5px;
      font-weight: 450;
      box-shadow: 0 8px 15px rgba(111, 163, 239, 0.16);
      margin-top: 2px;
    }

    .upload-desc {
      max-width: 460px;
      font-size: 12.5px;
      color: #8b96ac;
      line-height: 1.6;
      font-weight: 400;
      margin: 2px 0 0 0;
    }

    input[type="file"] {
      display: none;
    }

    /* 사이드바 열기 버튼 */
    .menu-button {
      width: 42px;
      height: 42px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;

      position: fixed;
      top: 16px;
      left: 10px;
      z-index: 30;

      opacity: 1;
      transform: translateX(0);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    body.sidebar-open .menu-button {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-8px);
    }

    .menu-icon {
      width: 22px;
      height: 17px;
      position: relative;
    }

    .menu-icon span {
      position: absolute;
      left: 0;
      height: 2px;
      border-radius: 999px;
      background: #7a7f89;
    }

    .menu-icon span:first-child {
      width: 17px;
      top: 2px;
    }

    .menu-icon span:last-child {
      width: 12px;
      top: 10px;
    }

    /* 사이드바 */
    .sidebar-overlay {
      display: none;
    }

    .sidebar-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid #eceef2;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.05);
      transform: translateX(-100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 50;

      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar.is-open {
      transform: translateX(0);
    }

    body.sidebar-open .container {
      width: calc(100% - 250px);
      max-width: calc(100% - 250px);
      margin-left: 250px;
      margin-right: 0;
    }

    .sidebar-header {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .sidebar-brand {
      font-size: 18px;
      font-weight: 550;
      color: #2f3440;
      letter-spacing: -0.3px;
    }

    .sidebar-close {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 10px;
      margin-right: -6px;
      position: relative;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .sidebar-close span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 1.6px;
      border-radius: 999px;
      background: #8a9099;
      transform-origin: center;
      transition: background 0.18s ease;
    }

    .sidebar-close span:first-child {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .sidebar-close span:last-child {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .sidebar-close:hover {
      background: #f5f6f8;
      transform: translateY(-1px);
    }

    .sidebar-close:hover span {
      background: #5f6b7a;
    }

    .sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 10px 10px;
    }

    .sidebar-group {
      margin-bottom: 25px;
    }

    .sidebar-add-button {
      width: calc(100% - 8px);
      height: 40px;
      margin: 0 auto;
      border: none;
      background: linear-gradient(180deg, #8bb5f6 0%, #73a2f0 100%);
      color: #ffffff;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 550;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

      box-shadow: 0 9px 18px rgba(120, 163, 234, 0.22);
    }

    .sidebar-add-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 11px 20px rgba(120, 163, 234, 0.28);
    }

    .sidebar-add-button:active {
      transform: translateY(0);
      box-shadow: 0 6px 12px rgba(120, 163, 234, 0.2);
    }

    .sidebar-add-plus {
      font-size: 15px;
      font-weight: 450;
      line-height: 1;
      position: relative;
      top: -1px;
    }

    .sidebar-section-label {
      margin: 0 8px 9px;
      font-size: 12px;
      font-weight: 400;
      color: #a0a6b0;
      letter-spacing: -0.1px;
    }

    .sidebar-menu-list,
    .workspace-list,
    .recent-list,
    .bottom-menu-list {
      display: flex;
      flex-direction: column;
      gap: 0px;
    }

    .sidebar-menu-item,
    .workspace-item,
    .recent-item,
    .bottom-menu-item {
      width: 100%;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 5px;
      border: none;
      background: transparent;
      border-radius: 9px;
      text-align: left;
      cursor: pointer;
      color: #4b525d;
      transition: background 0.18s ease;
    }

    .sidebar-menu-item:hover,
    .workspace-item:hover,
    .recent-item:hover,
    .bottom-menu-item:hover {
      background: #f5f6f8;
    }

    .sidebar-menu-item.is-active {
      background: #f1f3f5;
      color: #2f3440;
    }

    .sidebar-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4b525d;
      flex-shrink: 0;
    }

    .sidebar-icon svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .workspace-content,
    .recent-content {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .sidebar-text {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 350;
      line-height: 1.35;
      letter-spacing: -0.2px;
      color: #4b525d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workspace-meta,
    .recent-meta {
      font-size: 11.5px;
      color: #9aa1ab;
      margin-top: 2px;
      line-height: 1.3;
    }

    /* ── 개인 문서 삭제 버튼 ── */
    .recent-item {
      position: relative;
    }

    .recent-delete-btn {
      display: none;
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 13px;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .recent-item:hover .recent-delete-btn {
      display: flex;
    }

    .recent-delete-btn:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    /* ── 삭제 확인 모달 (사이드바용) ── */
    .sb-delete-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .sb-delete-overlay.is-open {
      display: flex;
    }

    .sb-delete-modal {
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px 24px;
      width: 320px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.15);
      text-align: center;
      animation: sbModalPop 0.2s ease;
    }

    @keyframes sbModalPop {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .sb-delete-modal-icon {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .sb-delete-modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .sb-delete-modal-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .sb-delete-modal-filename {
      font-weight: 600;
      color: #1e293b;
      word-break: break-all;
    }

    .sb-delete-actions {
      display: flex;
      gap: 8px;
    }

    .sb-btn-cancel {
      flex: 1;
      height: 42px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
    }

    .sb-btn-cancel:hover {
      background: #f1f5f9;
    }

    .sb-btn-delete {
      flex: 1;
      height: 42px;
      border: none;
      background: #ef4444;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }

    .sb-btn-delete:hover {
      background: #dc2626;
    }

    .sb-btn-delete:disabled {
      background: #fca5a5;
      cursor: not-allowed;
    }

    .workspace-item,
    .recent-item {
      align-items: center;
    }



    .sidebar-profile-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid #eef0f3;
      background: #ffffff;
      border-radius: 16px;
    }


    /* 프로필 영역 */
    .sidebar-profile {
      padding: 14px 16px;
      border-top: 1px solid #f1f3f5;
      background: #fcfcfd;
      flex-shrink: 0;

      display: grid;
      grid-template-columns: 0.7fr 1.3fr;
      align-items: center;
      column-gap: 12px;
    }

    .sidebar-profile-left {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .sidebar-profile-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #eef2f7;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-profile-avatar svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sidebar-profile-name {
      max-width: 58px;
      font-size: 11.5px;
      font-weight: 550;
      color: #313641;
      letter-spacing: -0.2px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-profile-actions {
      width: 100%;
      max-width: 120px;
      justify-self: center;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;

      transform: translateX(-6px);
    }

    .sidebar-profile-button {
      width: 100%;
      height: 28px;
      border: 1px solid #e8edf5;
      background: #f8faff;
      color: #52627c;
      border-radius: 11px;
      font-size: 11.5px;
      font-weight: 550;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .sidebar-profile-button.report {
      background: linear-gradient(180deg, #8bb5f6 0%, #73a2f0 100%);
      border: none;
      color: #ffffff;
      box-shadow: 0 6px 12px rgba(120, 163, 234, 0.18);
    }

    .sidebar-profile-button:hover {
      background: #edf5ff;
      color: #4d7fdc;
      transform: translateY(-1px);
    }

    .sidebar-profile-button.report:hover {
      background: linear-gradient(180deg, #82acf2 0%, #6999e8 100%);
      color: #ffffff;
    }

    @media (max-width: 900px) {
      .navbar {
        margin-bottom: 32px;
      }

      .hero h1 {
        font-size: clamp(24px, 6vw, 34px);
      }

      .hero p {
        font-size: 13.5px;
      }

      .upload-card {
        max-width: 700px;
        min-height: 230px;
        padding: 24px 18px;
      }

      body.sidebar-open .container {
        width: 100%;
        max-width: 100%;
        margin-left: 0;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px 14px 32px;
      }

      .logo {
        font-size: 18px;
      }

      .nav-button {
        padding: 8px 14px;
        font-size: 12px;
      }

      .hero-badge {
        font-size: 11px;
        padding: 6px 10px;
      }

      .hero h1 {
        font-size: 22px;
        margin-bottom: 12px;
      }

      .hero p {
        font-size: 13.5px;
        margin-bottom: 4px;
      }

      .upload-card {
        min-height: 220px;
        padding: 22px 16px;
      }

      .upload-title {
        font-size: 15.5px;
      }

      .upload-desc {
        font-size: 12px;
      }

      .upload-button {
        height: 35px;
        font-size: 13px;
      }

      .sidebar {
        width: 84vw;
        max-width: 290px;
      }
    }
  </style>
</head>

<body class="sidebar-open">
  <!-- 사이드바 오버레이 -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 사이드바 -->
  <aside class="sidebar is-open" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">👀</div>
      <button class="sidebar-close" id="closeSidebarButton" aria-label="사이드바 닫기">
        <span></span>
        <span></span>
      </button>
    </div>

    <div class="sidebar-scroll">
      <section class="sidebar-group">
        <button class="sidebar-add-button">
          <span class="sidebar-add-plus">+</span>
          <span>새 문서 추가</span>
        </button>
      </section>

      <section class="sidebar-group">
        <div class="sidebar-menu-list">
          <button class="sidebar-menu-item is-active" onclick="location.href='workspace.html'">
            <span class="sidebar-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5"></path>
                <path d="M5 9.5V20h14V9.5"></path>
              </svg>
            </span>
            <span class="sidebar-text">전체 워크스페이스</span>
          </button>
        </div>
      </section>

      <section class="sidebar-group">
        <div class="sidebar-section-label">최근 워크스페이스</div>
        <div class="workspace-list" id="sidebarWorkspaceList">
          <div style="padding:8px 10px;font-size:12px;color:#b0b8c4;">불러오는 중...</div>
        </div>
      </section>

      <section class="sidebar-group">

        <div class="sidebar-section-label">개인 문서</div>
        <div class="recent-list" id="sidebarRecentList">
          <div style="padding:8px 10px;font-size:12px;color:#b0b8c4;">불러오는 중...</div>
        </div>
      </section>

      <section class="sidebar-group">
        <div class="bottom-menu-list"></div>
      </section>
    </div>

    <div class="sidebar-profile">
      <div class="sidebar-profile-left">
        <div class="sidebar-profile-avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="32" fill="#edf2f8" />
            <circle cx="32" cy="25" r="10" fill="#aab4c2" />
            <path d="M16 52c2.5-11 9.5-17 16-17s13.5 6 16 17" fill="#aab4c2" />
          </svg>
        </div>
        <div class="sidebar-profile-name" id="profileName">-</div>
      </div>

      <div class="sidebar-profile-actions">
        <button class="sidebar-profile-button" onclick="location.href='profile.html'">
          계정 설정
        </button>
        <button class="sidebar-profile-button report" onclick="location.href='report.html'">
          집중도 레포트
        </button>
      </div>
    </div>
  </aside>

  <!-- 메인 콘텐츠 -->
  <div class="container">
    <header class="navbar">
      <div class="navbar-left">
        <button class="menu-button" id="openSidebarButton" aria-label="사이드바 열기">
          <div class="menu-icon">
            <span></span>
            <span></span>
          </div>
        </button>
        <div class="logo">NunGil</div>
      </div>
    </header>

    <main class="hero">
      <!-- <div class="hero-badge">AI 기반 학습 보조 도구</div> -->

      <p>문서를 업로드하면</p>
      <h1>
        <span class="highlight">눈길</span>이 학습에 <span class="highlight">집중</span>할 수 있도록 도와드릴게요 :)
      </h1>

      <div class="upload-card">
        <label for="fileUpload" class="upload-inner">
          <div class="upload-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 44V14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M21 25L32 14L43 25" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M13 39V46C13 51.5228 17.4772 56 23 56H41C46.5228 56 51 51.5228 51 46V39" stroke="currentColor"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>

          <div class="upload-title">파일을 선택하거나 드래그하세요</div>
          <div class="upload-button">파일 업로드</div>
          <div class="upload-desc">
            파일 형식 : PDF, PPT, PPTX
          </div>
        </label>

        <input type="file" id="fileUpload" accept=".pdf,.ppt,.pptx" />
      </div>
    </main>
  </div>

  <script>
    const openSidebarButton = document.getElementById("openSidebarButton");
    const closeSidebarButton = document.getElementById("closeSidebarButton");
    const sidebar = document.getElementById("sidebar");
    const hero = document.querySelector(".hero");

    function animateHeroMove(changeLayout) {
      const first = hero.getBoundingClientRect();

      changeLayout();

      const last = hero.getBoundingClientRect();

      const dx = first.left - last.left;
      const dy = first.top - last.top;

      hero.style.transition = "none";
      hero.style.transform = `translate(${dx}px, ${dy}px)`;

      requestAnimationFrame(() => {
        hero.style.transition = "transform 0.48s cubic-bezier(0.22, 1, 0.36, 1)";
        hero.style.transform = "translate(0, 0)";
      });
    }

    function openSidebar() {
      animateHeroMove(() => {
        sidebar.classList.add("is-open");
        document.body.classList.add("sidebar-open");
      });
    }

    function closeSidebar() {
      animateHeroMove(() => {
        sidebar.classList.remove("is-open");
        document.body.classList.remove("sidebar-open");
      });
    }

    hero.addEventListener("transitionend", () => {
      hero.style.transition = "";
      hero.style.transform = "";
    });

    openSidebarButton.addEventListener("click", openSidebar);
    closeSidebarButton.addEventListener("click", closeSidebar);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeSidebar();
    });
  </script>

  <!-- 데이터 로직 + 인증 가드 -->
  <script type="module">
    import { requireAuth, getCurrentUser, signOut } from '/src/lib/auth.js'
    import { uploadDocument } from '/src/lib/storage.js'
    import { createDocument, deleteDocument } from '/src/lib/db/documents.js'
    import { getWorkspaces } from '/src/lib/db/workspaces.js'
    import { getRecentDocuments } from '/src/lib/db/documents.js'

    // ── 인증 가드 ────────────────────────────────────────
    const session = await requireAuth()
    if (!session) throw new Error('unauthenticated')
    const userId = session.user.id

    // ── 프로필 표시 ──────────────────────────────────────
    const user = await getCurrentUser()
    document.getElementById('profileName').textContent = user?.profile?.name ?? '사용자'

    // ── 사이드바: 워크스페이스 목록 ──────────────────────
    const workspaceSvg = `
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path>
      </svg>`

    const docSvg = `
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <path d="M14 2v6h6"></path>
      </svg>`

    async function renderSidebar() {
      const wsList = document.getElementById('sidebarWorkspaceList')
      const recList = document.getElementById('sidebarRecentList')

      // 워크스페이스
      const workspaces = await getWorkspaces()

      if (workspaces.length === 0) {
        wsList.innerHTML = '<div style="padding:8px 10px;font-size:12px;color:#b0b8c4;">워크스페이스 없음</div>'
      } else {
        wsList.innerHTML = workspaces.slice(0, 5).map(ws => `
          <button class="workspace-item" data-ws-id="${ws.id}">
            <span class="sidebar-icon">${workspaceSvg}</span>
            <span class="workspace-content">
              <span class="sidebar-text">${ws.title}</span>
            </span>
          </button>
        `).join('')

        wsList.querySelectorAll('.workspace-item').forEach(el => {
          el.addEventListener('click', () => {
            location.href = `viewer.html?workspace_id=${el.dataset.wsId}`
          })
        })
      }

      // 개인 문서
      const recentDocs = await getRecentDocuments(5)

      if (recentDocs.length === 0) {
        recList.innerHTML = '<div style="padding:8px 10px;font-size:12px;color:#b0b8c4;">문서 없음</div>'
      } else {
        recList.innerHTML = recentDocs.map(doc => `
          <button class="recent-item" data-doc-id="${doc.id}" data-doc-name="${doc.file_name}">
            <span class="sidebar-icon">${docSvg}</span>
            <span class="recent-content">
              <span class="sidebar-text">${doc.file_name}</span>
            </span>
            <span class="recent-delete-btn" data-doc-id="${doc.id}" data-doc-name="${doc.file_name}" title="삭제">×</span>
          </button>`).join('')


        recList.querySelectorAll('.recent-item').forEach(el => {
          el.addEventListener('click', () => {
            location.href = `viewer.html?doc_id=${el.dataset.docId}`
          })
        })

        recList.querySelectorAll('.recent-delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation()
            document.getElementById('sbDeleteFilename').textContent = btn.dataset.docName
            document.getElementById('sbDeleteConfirmBtn').dataset.id = btn.dataset.docId
            document.getElementById('sbDeleteOverlay').classList.add('is-open')
          })
        })
      }
    }

    // ── 홈 화면 파일 업로드 ──────────────────────────────
    const fileInput = document.getElementById("fileUpload")
    const uploadTitle = document.querySelector(".upload-title")
    const uploadCard = document.querySelector(".upload-card")

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0]
      if (!file) return

      try {
        const { storagePath, fileType } = await uploadDocument(file, userId)

        const doc = await createDocument({
          userId,
          workspaceId: null,
          fileName: file.name,
          storagePath,
          fileType,
        })

        location.href = `processing.html?doc_id=${doc.id}`

      } catch (err) {
        alert('업로드 실패: ' + err.message)
      }
    })
    uploadCard.addEventListener("dragover", (e) => {
      e.preventDefault()
      uploadCard.style.borderColor = "#6fa3ef"
    })

    uploadCard.addEventListener("dragleave", () => {
      uploadCard.style.borderColor = "rgba(111, 163, 239, 0.16)"
    })

    uploadCard.addEventListener("drop", (e) => {
      e.preventDefault()
      uploadCard.style.borderColor = "rgba(111, 163, 239, 0.16)"

      if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files
        fileInput.dispatchEvent(new Event('change'))
      }
    })

    // ── 새 문서 추가 버튼 ────────────────────────────────
    document.querySelector('.sidebar-add-button').addEventListener('click', () => {
      fileInput.click()
    })

    // ── 초기화 ────────────────────────────────────────────
    renderSidebar()

    // ── 사이드바 삭제 모달 이벤트 ────────────────────────
    document.getElementById('sbDeleteCancelBtn').addEventListener('click', () => {
      document.getElementById('sbDeleteOverlay').classList.remove('is-open')
    })

    document.getElementById('sbDeleteConfirmBtn').addEventListener('click', async () => {
      const btn = document.getElementById('sbDeleteConfirmBtn')
      const id = btn.dataset.id
      btn.disabled = true
      btn.textContent = '삭제 중...'
      try {
        await deleteDocument(id)
        document.getElementById('sbDeleteOverlay').classList.remove('is-open')
        await renderSidebar()
      } catch (e) {
        alert('삭제 실패: ' + e.message)
      } finally {
        btn.disabled = false
        btn.textContent = '삭제'
      }
    })
  </script>
  <!-- 개인 문서 삭제 확인 모달 -->
  <div class="sb-delete-overlay" id="sbDeleteOverlay">
    <div class="sb-delete-modal">
      <div class="sb-delete-modal-title">문서를 삭제할까요?</div>
      <div class="sb-delete-modal-desc">
        <span class="sb-delete-modal-filename" id="sbDeleteFilename"></span><br>
        삭제한 문서는 복구할 수 없어요.
      </div>
      <div class="sb-delete-actions">
        <button class="sb-btn-cancel" id="sbDeleteCancelBtn">취소</button>
        <button class="sb-btn-delete" id="sbDeleteConfirmBtn">삭제</button>
      </div>
    </div>
  </div>

</body>

</html>
