<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>눈길 - 문서 준비 중</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 75% 55% at 10% 0%, #a8c8ff 0%, transparent 60%),
        radial-gradient(ellipse 65% 50% at 90% 0%, #93b8fa 0%, transparent 60%),
        #f8faff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .logo {
      position: absolute;
      top: 28px;
      left: 36px;
      font-size: 15px;
      font-weight: 700;
      color: #1e3a8a;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, .94);
      border-radius: 28px;
      padding: 36px 32px 32px;
      box-shadow: 0 20px 60px rgba(104, 146, 219, .18);
      border: 1px solid rgba(216, 228, 248, .9);
      backdrop-filter: blur(10px);
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: #f1f5fd;
      border-radius: 14px;
      margin-bottom: 28px;
    }

    .file-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .file-icon svg {
      width: 22px;
      height: 22px;
      stroke: #3b82f6;
    }

    .file-meta {
      min-width: 0;
    }

    .file-name {
      font-size: 14px;
      font-weight: 550;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .file-type {
      font-size: 12px;
      color: #64748b;
    }

    .card-title {
      font-size: 22px;
      font-weight: 550;
      color: #0f172a;
      letter-spacing: -.03em;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .35s ease, transform .35s ease;
    }

    .step.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .step-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
    }

    .step.pending .step-icon {
      background: #f1f5f9;
      color: #94a3b8;
    }

    .step.running .step-icon {
      background: #eff6ff;
      color: #3b82f6;
    }

    .step.done .step-icon {
      background: #f0fdf4;
      color: #16a34a;
    }

    .step-text {
      flex: 1;
    }

    .step-label {
      font-size: 14px;
      font-weight: 550;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .step-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.45;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(59, 130, 246, .25);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .dot-anim::after {
      content: "";
      animation: dots 1.2s steps(3, end) infinite;
    }

    @keyframes dots {
      0% {
        content: "";
      }

      33% {
        content: ".";
      }

      66% {
        content: "..";
      }

      100% {
        content: "...";
      }
    }

    .enter-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(180deg, #8bb5f6 0%, #73a2f0 100%);
      color: white;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(115, 162, 240, .25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity .35s ease, transform .35s ease, box-shadow .2s ease;
    }

    .enter-btn.ready {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .enter-btn.ready:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(115, 162, 240, .35);
    }

    .error-msg {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      font-size: 13px;
      color: #dc2626;
      text-align: center;
      line-height: 1.5;
    }

    .error-msg.show {
      display: block;
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="file-info">
      <div class="file-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
      </div>
      <div class="file-meta">
        <div class="file-name" id="fileName">문서 불러오는 중...</div>
        <div class="file-type" id="fileType">—</div>
      </div>
    </div>

    <h1 class="card-title">문서를 준비하고 있어요</h1>
    <p class="card-sub" id="cardSub">
      분석이 완료된 문서를 뷰어에서 바로 열 수 있도록 준비합니다.<br>
      잠시만 기다려 주세요.
    </p>

    <section class="steps">
      <div class="step pending" id="step-upload">
        <div class="step-icon">📄</div>
        <div class="step-text">
          <div class="step-label">문서 업로드 확인</div>
          <div class="step-desc">문서 정보를 불러옵니다</div>
        </div>
      </div>

      <div class="step pending" id="step-layout">
        <div class="step-icon">🔍</div>
        <div class="step-text">
          <div class="step-label" id="step-layout-label">레이아웃 분석 확인</div>
          <div class="step-desc">문서 위치 정보와 읽기 블록을 확인합니다</div>
        </div>
      </div>

      <div class="step pending" id="step-viewer">
        <div class="step-icon">👀</div>
        <div class="step-text">
          <div class="step-label" id="step-viewer-label">뷰어 준비</div>
          <div class="step-desc">원본 문서 화면으로 이동합니다</div>
        </div>
      </div>
    </section>

    <button class="enter-btn" id="enterBtn" type="button">
      뷰어로 진입하기 →
    </button>

    <div class="error-msg" id="errorMsg"></div>
  </main>

  <script type="module">
    import { requireAuth } from '/src/lib/auth.js'
    import { getDocument } from '/src/lib/db/documents.js'
    import { sb } from '/src/lib/supabase.js'

    const delay = ms => new Promise(resolve => setTimeout(resolve, ms))

    const params = new URLSearchParams(location.search)
    const docId = params.get('doc_id')
    const workspaceId = params.get('workspace_id')

    const fileNameEl = document.getElementById('fileName')
    const fileTypeEl = document.getElementById('fileType')
    const cardSub = document.getElementById('cardSub')
    const enterBtn = document.getElementById('enterBtn')

    if (!docId) {
      location.href = 'mainpage.html'
      throw new Error('doc_id가 없습니다.')
    }

    window._docId = docId
    window._workspaceId = workspaceId

    const viewerUrl = workspaceId
      ? `viewer.html?doc_id=${encodeURIComponent(docId)}&workspace_id=${encodeURIComponent(workspaceId)}`
      : `viewer.html?doc_id=${encodeURIComponent(docId)}`

    enterBtn.addEventListener('click', () => {
      location.href = viewerUrl
    })

    function setStep(id, state, labelOverride) {
      const el = document.getElementById(id)
      const label = document.getElementById(id + '-label')
      if (!el) return

      el.classList.remove('pending', 'running', 'done')
      el.classList.add(state, 'visible')

      const icon = el.querySelector('.step-icon')

      if (state === 'running') {
        icon.innerHTML = '<div class="spinner"></div>'
        if (label) {
          label.innerHTML = `${labelOverride ?? label.textContent} <span class="dot-anim">진행 중</span>`
        }
      }

      if (state === 'done') {
        icon.textContent = '✓'
        if (label) {
          label.textContent = labelOverride ?? label.textContent.replace(' 대기 중', '') + ' 완료'
        }
      }
    }

    function showError(message) {
      const el = document.getElementById('errorMsg')
      el.textContent = message
      el.classList.add('show')
    }

    try {
      await requireAuth()

      setStep('step-upload', 'running', '문서 업로드 확인')
      const doc = await getDocument(docId)

      fileNameEl.textContent = doc?.file_name || '문서'
      fileTypeEl.textContent =
        doc?.file_type === 'PPT'
          ? 'PPT 프레젠테이션'
          : 'PDF 문서'

      setStep('step-upload', 'done', '문서 업로드 확인 완료')

      await delay(350)

      setStep('step-layout', 'running', '레이아웃 분석')

      const { data: { session } } = await sb.auth.getSession()
      if (!session?.access_token) {
        throw new Error('로그인 세션이 없습니다.')
      }

      if (doc?.file_type === 'PPT') {
        const { error: pptErr } = await sb.functions.invoke('convert-ppt', {
          body: {
            document_id: docId,
          },
        })

        if (pptErr) {
          throw new Error(
            pptErr.message || 'PPT PDF 변환 실패'
          )
        }
      }

      const { data: result, error: fnError } = await sb.functions.invoke('parse-document', {
        body: { docId },
      })

      if (fnError) {
        throw new Error(fnError.message || '문서 분석 실패')
      }

      if (!result?.ok) {
        throw new Error(result?.error || '문서 분석 실패')
      }

      setStep('step-layout', 'done', '레이아웃 분석 완료')

      await delay(350)

      setStep('step-viewer', 'running', '뷰어 준비')
      await delay(500)
      setStep('step-viewer', 'done', '뷰어 준비 완료')

      cardSub.textContent = '준비가 완료됐어요. 이제 문서를 읽어볼까요?'
      enterBtn.classList.add('ready')

      setTimeout(() => {
        location.href = viewerUrl
      }, 700)

    } catch (e) {
      setStep('step-layout', 'done', '레이아웃 분석 실패')
      showError('문서 준비 중 오류가 발생했습니다: ' + e.message)
      enterBtn.classList.add('ready')
    }
  </script>
</body>

</html>
