<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>눈길 - 워크스페이스</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7da9f2;
      --primary-dark: #6a99eb;
      --primary-light: #f3f8ff;
      --bg: linear-gradient(180deg, #eef5ff 0%, #ffffff 55%, #ffffff 100%);
      --white: #ffffff;
      --text: #111827;
      --sub: #6b7280;
      --border: #e5e7eb;
      --shadow-sm: 0 2px 10px rgba(0,0,0,.05);
      --shadow-md: 0 12px 28px rgba(125, 169, 242, .16);
      --transition: .2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      padding: 28px 32px 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-back:hover {
      background: var(--white);
      color: var(--text);
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 17px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-outline {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: #f9fafb;
    }

    .btn-primary {
      background: linear-gradient(180deg, #8bb5f6 0%, #73a2f0 100%);
      color: white;
      box-shadow: 0 8px 20px rgba(125,169,242,.24);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(125,169,242,.30);
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .section-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .section-sub {
      font-size: 13px;
      color: var(--sub);
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 220px));
      gap: 25px;
      align-items: start;
    }

    .workspace-card {
      position: relative;
      width: 100%;
      height: 220px;
      background: linear-gradient(145deg, #c7dcff 0%, #9fc2fb 42%, #76a6ef 100%);
      border-radius: 34px;
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 10px 24px rgba(125, 169, 242, .14);
    }

    .workspace-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px rgba(125, 169, 242, .24);
    }

    .folder-shape {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #c7dcff 0%, #9fc2fb 42%, #76a6ef 100%);
      clip-path: polygon(0 20%, 48% 20%, 56% 0, 100% 0, 100% 100%, 0 100%);
    }

    .workspace-card-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 38px;
      background: linear-gradient(
        90deg,
        rgba(183, 208, 251, 0.55) 0%,
        rgba(143, 183, 244, 0.35) 60%,
        rgba(255,255,255,0.16) 100%
      );
      border-radius: 0 0 42% 0;
      transform: translateY(-8px) scaleY(1);
      z-index: 1;
    }

    .workspace-card-header {
      position: absolute;
      top: 17px;
      left: 16px;
      width: calc(100% - 32px);
      height: 84px;
      background: #fbfbfc;
      border-radius: 22px 22px 0 0;
      padding: 18px 42px 14px 18px;
      box-shadow: 0 4px 12px rgba(0,0,0,.04);
      z-index: 2;
      overflow: visible;
    }

    .workspace-card-header::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: -22px;
      width: 170px;
      height: 22px;
      background: #fbfbfc;
      border-radius: 0 0 0 18px;
    }

    .workspace-card-header::after {
      content: "";
      position: absolute;
      left: 168px;
      bottom: -22px;
      width: 42px;
      height: 42px;
      background: #fbfbfc;
      border-radius: 0 0 18px 0;
      transform: skewX(-30deg);
      transform-origin: top left;
    }

    .workspace-card-header-title {
      font-size: 12px;
      font-weight: 700;
      color: #4b5563;
      margin-bottom: 6px;
      line-height: 1.3;
      word-break: keep-all;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .workspace-card-header-meta {
      font-size: 11px;
      color: #98a2b3;
      font-weight: 600;
    }

    .workspace-card-body {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70%;
      z-index: 3;
    }

    .workspace-card-text {
      position: absolute;
      inset: 0;
      z-index: 4;
      padding: 20px 15px 28px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: white;
    }

    .workspace-card-title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 7px;
      word-break: keep-all;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 1px rgba(0,0,0,.05);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .workspace-card-meta {
  font-size: 11px;
  font-weight: 600;
  opacity: 0.96;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.workspace-menu-wrap {
  position: relative;
  margin-left: auto;
  z-index: 30;
}

.workspace-menu-btn {
  width: 26px;
  height: 22px;
  border: none;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1;
  transition: background 0.15s, color 0.15s;
}

.workspace-menu-btn:hover {
  background: rgba(255, 255, 255, 0.22);
  color: white;
}

.workspace-dropdown {
  display: none;
  position: absolute;
  right: 0;
  bottom: 28px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.10);
  min-width: 120px;
  z-index: 100;
  overflow: hidden;
}

    .workspace-dropdown.is-open {
      display: block;
    }

    .workspace-dropdown-item {
      width: 100%;
      padding: 11px 14px;
      border: none;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .workspace-dropdown-item:hover {
      background: #f8fafc;
    }

    .workspace-dropdown-item.danger {
      color: #ef4444;
    }

    .workspace-dropdown-item.danger:hover {
      background: #fff5f5;
    }

    .workspace-add {
      width: 100%;
      height: 220px;
      border: 1.5px dashed #cfe0f8;
      background: var(--bg);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      color: #7b8794;
      transition: var(--transition);
    }

    .workspace-add:hover {
      background: #f6faff;
    }

    .workspace-add-icon {
      position: relative;
      width: 42px;
      height: 42px;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .workspace-add-icon::before,
    .workspace-add-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      background: #7b8794;
      transform: translate(-50%, -50%);
      border-radius: 999px;
    }

    .workspace-add-icon::before {
      width: 20px;
      height: 1.5px;
    }

    .workspace-add-icon::after {
      width: 1.5px;
      height: 20px;
    }

    .workspace-add-text {
      font-size: 14px;
      font-weight: 200;
      color: #7b8794;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.25);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: min(420px, 100%);
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(0,0,0,.15);
      animation: modalPop 0.2s ease;
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-box h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-box p {
      font-size: 13px;
      color: var(--sub);
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .modal-input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    .delete-modal-title {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .delete-modal-desc {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .delete-modal-name {
      font-weight: 700;
      color: #1e293b;
      word-break: break-all;
    }

    @media (max-width: 768px) {
      .page {
        padding: 20px;
      }

      .topbar,
      .section-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .top-actions {
        width: 100%;
      }

      .top-actions .btn {
        flex: 1;
      }

      .workspace-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
      }

      .workspace-card,
      .workspace-add {
        height: 200px;
      }

      .workspace-card-title {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <button class="btn-back" onclick="history.back()">← 뒤로</button>
      <div class="top-actions">
        <button class="btn btn-primary" id="openCreateModalBtn">+ 새 워크스페이스</button>
      </div>
    </header>

    <section>
      <div class="section-header">
        <div>
          <div class="section-title">전체 워크스페이스</div>
          <div class="section-sub">워크스페이스를 클릭하면 해당 워크스페이스 내부의 문서를 볼 수 있어요.</div>
        </div>
      </div>

      <div class="workspace-grid" id="workspaceGrid"></div>
    </section>
  </div>

  <!-- 생성 모달 -->
  <div class="modal" id="createModal">
    <div class="modal-box">
      <h3>새 워크스페이스 만들기</h3>
      <p>워크스페이스 이름을 입력해주세요.</p>
      <input
        type="text"
        id="workspaceNameInput"
        class="modal-input"
        placeholder="예: 캡스톤 워크스페이스"
        maxlength="30"
      />
      <div class="modal-actions">
        <button class="btn btn-outline" id="closeCreateModalBtn">취소</button>
        <button class="btn btn-primary" id="createWorkspaceBtn">생성하기</button>
      </div>
    </div>
  </div>

  <!-- 이름 변경 모달 -->
  <div class="modal" id="renameModal">
    <div class="modal-box">
      <h3>워크스페이스 이름 변경</h3>
      <p>새로운 워크스페이스 이름을 입력해주세요.</p>
      <input
        type="text"
        id="renameWorkspaceInput"
        class="modal-input"
        placeholder="워크스페이스 이름"
        maxlength="30"
      />
      <div class="modal-actions">
        <button class="btn btn-outline" id="closeRenameModalBtn">취소</button>
        <button class="btn btn-primary" id="renameWorkspaceBtn">변경하기</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div class="modal" id="deleteModal">
    <div class="modal-box">
      <div class="delete-modal-title">
  ‘<span id="deleteWorkspaceName"></span>’ 워크스페이스를 삭제할까요?
</div>
<div class="delete-modal-desc">
  워크스페이스와 안에 있던 문서가 모두 삭제돼요.
</div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="closeDeleteModalBtn">취소</button>
        <button class="btn btn-danger" id="deleteWorkspaceBtn">삭제</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/src/lib/auth.js'
    import { getWorkspaces, createWorkspace } from '/src/lib/db/workspaces.js'
    import { getDocuments } from '/src/lib/db/documents.js'
    import { sb } from '/src/lib/supabase.js'

    // ── 인증 가드 ───────────────────────────────────────────
    const session = await requireAuth()
    if (!session) throw new Error('unauthenticated')

    const workspaceGrid = document.getElementById('workspaceGrid')

    const createModal = document.getElementById('createModal')
    const workspaceNameInput = document.getElementById('workspaceNameInput')
    const createBtn = document.getElementById('createWorkspaceBtn')

    const renameModal = document.getElementById('renameModal')
    const renameWorkspaceInput = document.getElementById('renameWorkspaceInput')
    const renameBtn = document.getElementById('renameWorkspaceBtn')

    const deleteModal = document.getElementById('deleteModal')
    const deleteWorkspaceName = document.getElementById('deleteWorkspaceName')
    const deleteBtn = document.getElementById('deleteWorkspaceBtn')

    let selectedWorkspaceId = null
    let selectedWorkspaceTitle = ''
    let isCreatingWorkspace = false
    let isRenamingWorkspace = false
    let isDeletingWorkspace = false

    // ── HTML 이스케이프 ─────────────────────────────────────
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;')
    }

    // ── 워크스페이스 이름 변경 ──────────────────────────────
    async function updateWorkspaceTitle(workspaceId, title) {
      const { error } = await sb
        .from('workspaces')
        .update({ title })
        .eq('id', workspaceId)

      if (error) throw error
    }

    // ── 워크스페이스 삭제 ───────────────────────────────────
    async function deleteWorkspace(workspaceId) {
  // 1. 이 워크스페이스 안에 있는 문서들까지 DB에서 삭제
  const { error: docError } = await sb
    .from('documents')
    .delete()
    .eq('workspace_id', workspaceId)

  if (docError) throw docError

  // 2. 워크스페이스 삭제
  const { error: wsError } = await sb
    .from('workspaces')
    .delete()
    .eq('id', workspaceId)

  if (wsError) throw wsError
}

    // ── 워크스페이스 카드 렌더링 ────────────────────────────
    async function renderWorkspaceCards() {
      workspaceGrid.innerHTML = '<div style="grid-column:1/-1;padding:20px;color:#b0b8c4;font-size:13px;">불러오는 중...</div>'

      let workspaces = []

      try {
        workspaces = await getWorkspaces()
      } catch (e) {
        workspaceGrid.innerHTML = `<div style="grid-column:1/-1;padding:20px;color:#ef4444;font-size:13px;">워크스페이스를 불러오지 못했습니다.<br>${esc(e.message)}</div>`
        return
      }

      workspaceGrid.innerHTML = ''

      // 새 워크스페이스 추가 카드
      const addCard = document.createElement('div')
      addCard.className = 'workspace-add'
      addCard.innerHTML = `
        <div class="workspace-add-icon"></div>
        <div class="workspace-add-text">새 워크스페이스</div>
      `
      addCard.addEventListener('click', openCreateModal)
      workspaceGrid.appendChild(addCard)

      if (workspaces.length === 0) {
        const empty = document.createElement('div')
        empty.style.cssText = 'grid-column:1/-1;padding:20px;color:#b0b8c4;font-size:13px;'
        empty.textContent = '아직 워크스페이스가 없어요. 새로 만들어보세요!'
        workspaceGrid.appendChild(empty)
        return
      }

      // 문서 수 일괄 조회
      const docCounts = await Promise.all(
        workspaces.map(ws =>
          getDocuments(ws.id)
            .then(docs => ({ id: ws.id, count: docs.length }))
            .catch(() => ({ id: ws.id, count: 0 }))
        )
      )

      const countMap = Object.fromEntries(docCounts.map(d => [d.id, d.count]))

      workspaces.forEach(ws => {
        const fileCount = countMap[ws.id] ?? 0
        const safeTitle = esc(ws.title)

        const card = document.createElement('div')
        card.className = 'workspace-card'
        card.dataset.wsId = ws.id
        card.dataset.wsTitle = ws.title

        card.innerHTML = `
  <div class="workspace-card-top"></div>

  <div class="workspace-card-header">
    <div class="workspace-card-header-title">${safeTitle}</div>
    <div class="workspace-card-header-meta">${fileCount}개의 문서</div>
  </div>

  <div class="workspace-card-body">
    <div class="folder-shape"></div>
    <div class="workspace-card-text">
      <div class="workspace-card-title">${safeTitle}</div>

      <div class="workspace-card-meta">
  <span>${fileCount}개의 문서</span>

  <div class="workspace-menu-wrap">
    <button class="workspace-menu-btn" data-id="${ws.id}" data-title="${safeTitle}" title="더보기">···</button>
    <div class="workspace-dropdown" id="workspaceDropdown-${ws.id}">
      <button class="workspace-dropdown-item rename" data-id="${ws.id}" data-title="${safeTitle}">
        이름 변경
      </button>
      <button class="workspace-dropdown-item danger delete" data-id="${ws.id}" data-title="${safeTitle}">
        삭제
      </button>
    </div>
  </div>
</div>
    </div>
  </div>
`

        card.addEventListener('click', (e) => {
          if (e.target.closest('.workspace-menu-wrap')) return
          location.href = `viewer.html?workspace_id=${ws.id}`
        })

        workspaceGrid.appendChild(card)
      })

      bindWorkspaceMenuEvents()
    }

    // ── 워크스페이스 메뉴 이벤트 ───────────────────────────
    function bindWorkspaceMenuEvents() {
      document.querySelectorAll('.workspace-menu-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation()

          const dropdown = document.getElementById(`workspaceDropdown-${btn.dataset.id}`)
          const isOpen = dropdown.classList.contains('is-open')

          document.querySelectorAll('.workspace-dropdown').forEach(d => {
            d.classList.remove('is-open')
          })

          if (!isOpen) dropdown.classList.add('is-open')
        })
      })

      document.querySelectorAll('.workspace-dropdown-item.rename').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation()
          document.querySelectorAll('.workspace-dropdown').forEach(d => d.classList.remove('is-open'))

          selectedWorkspaceId = btn.dataset.id
          selectedWorkspaceTitle = btn.dataset.title

          openRenameModal(selectedWorkspaceTitle)
        })
      })

      document.querySelectorAll('.workspace-dropdown-item.delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation()
          document.querySelectorAll('.workspace-dropdown').forEach(d => d.classList.remove('is-open'))

          selectedWorkspaceId = btn.dataset.id
          selectedWorkspaceTitle = btn.dataset.title

          openDeleteModal(selectedWorkspaceTitle)
        })
      })
    }

    // 외부 클릭 시 드롭다운 닫기
    document.addEventListener('click', () => {
      document.querySelectorAll('.workspace-dropdown').forEach(d => d.classList.remove('is-open'))
    })

    // ── 생성 모달 열기/닫기 ────────────────────────────────
    function openCreateModal() {
      createModal.classList.add('open')
      workspaceNameInput.value = ''
      workspaceNameInput.focus()
    }

    function closeCreateModal() {
      createModal.classList.remove('open')
    }

    // ── 이름 변경 모달 열기/닫기 ───────────────────────────
    function openRenameModal(title) {
      renameModal.classList.add('open')
      renameWorkspaceInput.value = title
      renameWorkspaceInput.focus()
      renameWorkspaceInput.select()
    }

    function closeRenameModal() {
      renameModal.classList.remove('open')
      selectedWorkspaceId = null
      selectedWorkspaceTitle = ''
    }

    // ── 삭제 모달 열기/닫기 ────────────────────────────────
    function openDeleteModal(title) {
      deleteWorkspaceName.textContent = title
      deleteModal.classList.add('open')
    }

    function closeDeleteModal() {
      deleteModal.classList.remove('open')
      selectedWorkspaceId = null
      selectedWorkspaceTitle = ''
    }

    // ── 워크스페이스 생성 ───────────────────────────────────
    async function handleCreate() {
      if (isCreatingWorkspace) return

      const title = workspaceNameInput.value.trim()
      if (!title) {
        alert('워크스페이스 이름을 입력해 주세요.')
        return
      }

      isCreatingWorkspace = true
      createBtn.disabled = true
      createBtn.textContent = '생성 중...'

      try {
        await createWorkspace(title)
        closeCreateModal()
        workspaceNameInput.value = ''
        await renderWorkspaceCards()
      } catch (e) {
        alert('생성 실패: ' + e.message)
      } finally {
        isCreatingWorkspace = false
        createBtn.disabled = false
        createBtn.textContent = '생성하기'
      }
    }

    // ── 워크스페이스 이름 변경 처리 ─────────────────────────
    async function handleRename() {
      if (isRenamingWorkspace) return
      if (!selectedWorkspaceId) return

      const newTitle = renameWorkspaceInput.value.trim()

      if (!newTitle) {
        alert('워크스페이스 이름을 입력해 주세요.')
        return
      }

      if (newTitle === selectedWorkspaceTitle) {
        closeRenameModal()
        return
      }

      isRenamingWorkspace = true
      renameBtn.disabled = true
      renameBtn.textContent = '변경 중...'

      try {
        await updateWorkspaceTitle(selectedWorkspaceId, newTitle)
        closeRenameModal()
        await renderWorkspaceCards()
      } catch (e) {
        alert('이름 변경 실패: ' + e.message)
      } finally {
        isRenamingWorkspace = false
        renameBtn.disabled = false
        renameBtn.textContent = '변경하기'
      }
    }

    // ── 워크스페이스 삭제 처리 ──────────────────────────────
    async function handleDelete() {
      if (isDeletingWorkspace) return
      if (!selectedWorkspaceId) return

      isDeletingWorkspace = true
      deleteBtn.disabled = true
      deleteBtn.textContent = '삭제 중...'

      try {
        await deleteWorkspace(selectedWorkspaceId)
        closeDeleteModal()
        await renderWorkspaceCards()
      } catch (e) {
        alert('삭제 실패: ' + e.message)
      } finally {
        isDeletingWorkspace = false
        deleteBtn.disabled = false
        deleteBtn.textContent = '삭제'
      }
    }

    // ── 이벤트 바인딩 ───────────────────────────────────────
    document.getElementById('openCreateModalBtn').addEventListener('click', openCreateModal)
    document.getElementById('closeCreateModalBtn').addEventListener('click', closeCreateModal)
    createBtn.addEventListener('click', handleCreate)

    workspaceNameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault()
        if (e.repeat) return
        handleCreate()
      }
    })

    createModal.addEventListener('click', e => {
      if (e.target === createModal) closeCreateModal()
    })

    document.getElementById('closeRenameModalBtn').addEventListener('click', closeRenameModal)
    renameBtn.addEventListener('click', handleRename)

    renameWorkspaceInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault()
        if (e.repeat) return
        handleRename()
      }
    })

    renameModal.addEventListener('click', e => {
      if (e.target === renameModal) closeRenameModal()
    })

    document.getElementById('closeDeleteModalBtn').addEventListener('click', closeDeleteModal)
    deleteBtn.addEventListener('click', handleDelete)

    deleteModal.addEventListener('click', e => {
      if (e.target === deleteModal) closeDeleteModal()
    })

    // ── 초기 렌더링 ─────────────────────────────────────────
    await renderWorkspaceCards()
  </script>
</body>
</html>
