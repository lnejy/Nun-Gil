<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>집중도 레포트 - 눈길</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --p: #78a3ea;
            --inner-bg: rgba(255, 255, 255, 0.6);
            --text-dark: #2f3440;
            --text-gray: #a0a6b0;
            --border: #eceef2;
            --tr: .3s cubic-bezier(.4, 0, .2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background:
                radial-gradient(ellipse 75% 55% at 10% 0%, rgba(168, 200, 255, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse 65% 50% at 90% 0%, rgba(147, 184, 250, 0.3) 0%, transparent 60%),
                #fbfcfd;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* ── 전체 래퍼 ── */
        .app-wrapper {
            width: 95vw;
            height: 90vh;
            background-color: var(--inner-bg);
            backdrop-filter: blur(30px) saturate(150%);
            border-radius: 40px;
            display: flex;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        /* ── 왼쪽 패널 ── */
        .left-panel {
            width: 42%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        /* 왼쪽 상단 고정 영역 */
        .left-header {
            padding: 44px 44px 24px;
            flex-shrink: 0;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            color: var(--text-gray);
            margin-bottom: 28px;
            margin-left: -8px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            color: var(--text-dark);
            transform: translateX(-3px);
        }

        .report-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .report-subtitle {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 20px;
        }

        .avg-score {
            font-size: 60px;
            font-weight: 900;
            color: var(--p);
            line-height: 1;
        }

        .avg-score .unit {
            font-size: 22px;
            font-weight: 700;
            vertical-align: top;
            margin-left: 4px;
        }

        /* 왼쪽 하단: 스크롤되는 학습 기록 목록 */
        .left-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 4px 44px 28px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .list-section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-gray);
            margin-bottom: 12px;
            padding-top: 4px;
        }

        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 14px 18px;
            gap: 12px;
            cursor: pointer;
            transition: var(--tr);
            margin-bottom: 8px;
            text-align: left;
            width: 100%;
            font-family: inherit;
        }

        .session-item:hover {
            border-color: var(--p);
            box-shadow: 0 4px 14px rgba(120, 163, 234, 0.1);
        }

        .session-item.is-active {
            border-color: var(--p);
            background: #f0f5ff;
            box-shadow: 0 4px 14px rgba(120, 163, 234, 0.12);
        }

        .session-info { min-width: 0; flex: 1; }
        .session-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .session-meta {
            font-size: 11px;
            color: var(--text-gray);
        }

        .session-score-badge {
            font-size: 20px;
            font-weight: 900;
            color: var(--p);
            flex-shrink: 0;
            min-width: 52px;
            text-align: right;
        }

        .session-score-badge span {
            font-size: 12px;
            font-weight: 600;
        }

        /* ── 오른쪽 패널 ── */
        .right-panel {
            flex: 1;
            padding: 50px 50px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
        }

        /* 빈 상태 */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-gray);
            gap: 14px;
        }

        .empty-state i {
            font-size: 40px;
            color: #c8d4e8;
        }

        .empty-state p {
            font-size: 14px;
            font-weight: 500;
        }

        /* 상세 뷰 */
        .detail-view { display: none; }
        .detail-view.is-visible { display: block; }

        .detail-doc-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-doc-meta {
            font-size: 12px;
            color: var(--text-gray);
            margin-bottom: 28px;
        }

        .detail-score-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .detail-score-label {
            font-size: 13px;
            color: var(--text-gray);
        }

        .detail-score-num {
            font-size: 64px;
            font-weight: 900;
            color: var(--p);
            line-height: 1;
        }

        .detail-score-num .unit {
            font-size: 22px;
            font-weight: 700;
            vertical-align: top;
            margin-left: 4px;
        }

        /* 지표 카드 그리드 */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }

        .metric-card {
            background: white;
            padding: 22px 16px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--border);
            transition: var(--tr);
        }

        .metric-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.05); }

        .metric-label {
            font-size: 11px;
            color: var(--text-gray);
            margin-bottom: 8px;
            display: block;
        }

        .metric-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
        }

        /* 점수 산출 내역 */
        .detail-section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 14px;
        }

        .score-breakdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .score-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-card-label {
            font-size: 12px;
            color: var(--text-gray);
            font-weight: 500;
        }

        .score-max {
            font-size: 12px;
            color: var(--text-gray);
            font-weight: 400;
        }

        .score-card-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.06); border-radius: 10px; }
    </style>
</head>

<body>
    <div class="app-wrapper">

        <!-- 왼쪽: 전체 평균 + 학습 기록 목록 -->
        <div class="left-panel">
            <div class="left-header">
                <button class="back-btn" onclick="history.back()">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="report-title">집중도 레포트</div>
                <div class="report-subtitle" id="avgSubtitle">학습 세션 데이터를 불러오는 중...</div>
                <div class="avg-score" id="avgScore">
                    --<span class="unit">점</span>
                </div>
            </div>

            <div class="left-scroll">
                <div class="list-section-label">학습 기록</div>
                <div id="sessionList">
                    <div style="text-align:center;color:var(--text-gray);font-size:13px;padding:24px 0;">불러오는 중...</div>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 상세 뷰 -->
        <div class="right-panel">
            <div class="empty-state" id="emptyState">
                <i class="fa-regular fa-chart-bar"></i>
                <p>학습 기록을 선택하면<br>상세 집중도 리포트를 볼 수 있어요.</p>
            </div>

            <div class="detail-view" id="detailView">
                <div class="detail-doc-name" id="detailDocName"></div>
                <div class="detail-doc-meta" id="detailDocMeta"></div>

                <div class="detail-score-row">
                    <div>
                        <div class="detail-score-label">집중도 점수</div>
                    </div>
                    <div class="detail-score-num" id="detailScore">
                        --<span class="unit">점</span>
                    </div>
                </div>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">경고 횟수</span>
                        <div class="metric-value" id="detailWarnRate">--</div>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">경고창 평균 반응 시간</span>
                        <div class="metric-value" id="detailReactTime">--</div>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">정상 응시 비율</span>
                        <div class="metric-value" id="detailGazeRatio">--</div>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">문단 재독 횟수</span>
                        <div class="metric-value" id="detailRereadCount">--</div>
                    </div>
                </div>

                <div class="detail-section-title" style="margin-top:20px;">구간별 집중 점수</div>
                <div id="focusChartWrap" style="margin-top:8px;">
                    <canvas id="focusChart" height="130" style="width:100%;display:block;"></canvas>
                    <p id="focusChartEmpty" style="display:none;font-size:12px;color:var(--text-gray);text-align:center;padding:20px 0;">
                        아직 스냅샷 데이터가 없습니다.<br>다음 세션부터 그래프가 표시됩니다.
                    </p>
                </div>

                <div class="detail-section-title" style="margin-top:20px;">점수 산출 내역</div>
                <div class="score-breakdown">
                    <div class="score-card">
                        <span class="score-card-label">정상 응시 점수</span>
                        <span class="score-card-value"><span id="detailSGaze">--</span><span class="score-max">&nbsp;/ 25점</span></span>
                    </div>
                    <div class="score-card">
                        <span class="score-card-label">경고 점수</span>
                        <span class="score-card-value"><span id="detailSWarn">--</span><span class="score-max">&nbsp;/ 15점</span></span>
                    </div>
                    <div class="score-card">
                        <span class="score-card-label">반응 점수</span>
                        <span class="score-card-value"><span id="detailSReact">--</span><span class="score-max">&nbsp;/ 10점</span></span>
                    </div>
                    <div class="score-card">
                        <span class="score-card-label">재독 점수</span>
                        <span class="score-card-value"><span id="detailSReread">--</span><span class="score-max">&nbsp;/ 50점</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth } from '/src/lib/auth.js'
        import { sb }         from '/src/lib/supabase.js'

        /**
         * 종합 집중도 점수 계산 (100점 만점)
         *   sGaze  (25점): 정상 응시 비율
         *   sWarn  (15점): 경고 감점 (10회 이상이면 0점)
         *   sReact (10점): 경고 반응 속도 (경고 없으면 만점)
         *   sReread(50점): 문단 재독 감점 — 핵심 학습 품질 지표
         */
        function computeScore(T, W, F, R, RR) {
            if (T <= 0) return { score: 0, sGaze: 0, sWarn: 0, sReact: 0, sReread: 0 }
            const sGaze   = (F / T) * 25
            const sWarn   = Math.max(0, 15 * (1 - W / 10))
            const sReact  = W === 0 ? 10 : Math.max(0, 10 * (1 - (R - 1) / 9))
            const minutes = T / 60
            const rrPerMin = minutes > 0 ? RR / minutes : 0
            const sReread = Math.max(0, 50 * (1 - rrPerMin / 3))
            return {
                score:   Math.round(sGaze + sWarn + sReact + sReread),
                sGaze:   Math.round(sGaze * 10) / 10,
                sWarn:   Math.round(sWarn * 10) / 10,
                sReact:  Math.round(sReact * 10) / 10,
                sReread: Math.round(sReread * 10) / 10,
            }
        }

        /**
         * 10초 구간 독립 점수 계산 (0~100)
         * 매 10초 구간마다 독립적으로 산출 → 상승·하강 모두 가능
         *   기본 점수 (0~100): 10초 중 집중한 비율
         *   경고 감점 (-15): 해당 구간에 경고 발생 시
         *   재독 감점 (-5 × 횟수, 최대 -20): 재독 많을수록 감점
         */
        function computeIntervalScore(focusDelta, hadWarning, rereadDelta) {
            const base    = Math.min(100, Math.round((focusDelta / 10) * 100))
            const penalty = (hadWarning ? 15 : 0) + Math.min(20, (rereadDelta || 0) * 5)
            return Math.max(0, base - penalty)
        }

        const session = await requireAuth()
        if (!session) throw new Error('unauthenticated')
        const user = session.user

        // ── 전체 학습 기록 로드 ────────────────────────────
        const { data: sessions } = await sb
            .from('study_sessions')
            .select('id, start_time, duration_minutes, alert_count, focus_time_seconds, avg_alert_response_seconds, reread_count, documents(file_name)')
            .eq('user_id', user.id)
            .eq('status', 'COMPLETED')
            .order('start_time', { ascending: false })

        const avgSubtitleEl = document.getElementById('avgSubtitle')
        const avgScoreEl    = document.getElementById('avgScore')
        const listEl        = document.getElementById('sessionList')

        if (!sessions || sessions.length === 0) {
            avgSubtitleEl.textContent = '아직 완료된 학습 세션이 없어요.'
            avgScoreEl.innerHTML = '--<span class="unit">점</span>'
            listEl.innerHTML = '<div style="text-align:center;color:var(--text-gray);font-size:13px;padding:24px 0;">학습 기록이 없어요.</div>'
        } else {
            // 전체 평균 점수 계산
            let sumScore = 0
            const computed = sessions.map(s => {
                const T  = (s.duration_minutes ?? 0) * 60
                const W  = s.alert_count ?? 0
                const F  = s.focus_time_seconds ?? 0
                const R  = s.avg_alert_response_seconds ?? 0
                const RR = s.reread_count ?? 0
                const result = computeScore(T, W, F, R, RR)

                const warnRate    = W
                const gazeRatio   = T > 0 ? ((F / T) * 100).toFixed(1)       : '0.0'
                const reactTime   = W > 0 ? R.toFixed(1)                      : '0.0'
                const rereadCount = RR

                sumScore += result.score

                const date    = new Date(s.start_time)
                const dateStr = `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')}`
                const durMin  = Math.round(s.duration_minutes ?? 0)

                return {
                    id: s.id,
                    title: s.documents?.file_name ?? '알 수 없는 문서',
                    dateStr,
                    durMin,
                    warnRate,
                    gazeRatio,
                    reactTime,
                    rereadCount,
                    ...result,
                }
            })

            const n = sessions.length
            const avgScore = Math.round(sumScore / n)

            avgSubtitleEl.textContent = `총 ${n}회 학습 세션 평균 기준`
            avgScoreEl.innerHTML = `${avgScore}<span class="unit">점</span>`

            // ── 목록 렌더링 ──────────────────────────────────
            listEl.innerHTML = ''
            computed.forEach(c => {
                const btn = document.createElement('button')
                btn.className = 'session-item'
                btn.dataset.id = c.id
                btn.innerHTML = `
                    <div class="session-info">
                        <div class="session-name">${c.title}</div>
                        <div class="session-meta">${c.dateStr} · ${c.durMin}분 학습</div>
                    </div>
                    <div class="session-score-badge">${c.score}<span>점</span></div>`
                btn.addEventListener('click', () => toggleDetail(btn, c))
                listEl.appendChild(btn)
            })
        }

        // ── 상세 뷰 토글 ─────────────────────────────────────
        let activeBtn = null

        function toggleDetail(btn, c) {
            const emptyState = document.getElementById('emptyState')
            const detailView = document.getElementById('detailView')

            if (activeBtn === btn) {
                // 같은 항목 클릭 → 닫기
                btn.classList.remove('is-active')
                activeBtn = null
                detailView.classList.remove('is-visible')
                emptyState.style.display = 'flex'
                return
            }

            // 이전 활성 해제
            if (activeBtn) activeBtn.classList.remove('is-active')
            btn.classList.add('is-active')
            activeBtn = btn

            // 상세 데이터 채우기
            document.getElementById('detailDocName').textContent     = c.title
            document.getElementById('detailDocMeta').textContent     = `${c.dateStr} · ${c.durMin}분 학습`
            document.getElementById('detailScore').innerHTML         = `${c.score}<span class="unit">점</span>`
            document.getElementById('detailWarnRate').textContent    = `${c.warnRate}회`
            document.getElementById('detailReactTime').textContent   = `${c.reactTime}초`
            document.getElementById('detailGazeRatio').textContent   = `${c.gazeRatio}%`
            document.getElementById('detailRereadCount').textContent = `${c.rereadCount}회`
            document.getElementById('detailSGaze').textContent      = `${c.sGaze}점`
            document.getElementById('detailSWarn').textContent      = `${c.sWarn}점`
            document.getElementById('detailSReact').textContent     = `${c.sReact}점`
            document.getElementById('detailSReread').textContent    = `${c.sReread}점`

            emptyState.style.display = 'none'
            detailView.classList.add('is-visible')

            // 분당 집중율 그래프 로드
            renderFocusChart(c.id)
        }

        async function renderFocusChart(sessionId) {
            const canvas   = document.getElementById('focusChart')
            const emptyMsg = document.getElementById('focusChartEmpty')
            if (!canvas) return

            const { data: snaps } = await sb
                .from('session_snapshots')
                .select('elapsed_min, focus_seconds, alert_count, reread_count')
                .eq('session_id', sessionId)
                .order('elapsed_min', { ascending: true })

            if (!snaps || snaps.length < 2) {
                // 0분 스냅샷만 있으면 (또는 없으면) 그래프 미표시
                canvas.style.display = 'none'
                emptyMsg.style.display = 'block'
                return
            }
            canvas.style.display = 'block'
            emptyMsg.style.display = 'none'

            // 구간별 독립 점수 계산 (10초 단위, i=0은 시작점)
            const points = []
            // 0초 시작점
            points.push({ tick: snaps[0].elapsed_min, score: null, alert: false })

            for (let i = 1; i < snaps.length; i++) {
                const focusDelta  = snaps[i].focus_seconds - snaps[i - 1].focus_seconds
                const hadWarning  = (snaps[i].alert_count ?? 0) > (snaps[i - 1].alert_count ?? 0)
                const rereadDelta = (snaps[i].reread_count ?? 0) - (snaps[i - 1].reread_count ?? 0)
                const score = computeIntervalScore(focusDelta, hadWarning, rereadDelta)
                points.push({ tick: snaps[i].elapsed_min, score, alert: hadWarning })
            }

            // 0초의 score를 첫 구간 점수로 채움 (그래프 시작점)
            if (points.length > 1 && points[0].score === null) {
                points[0].score = points[1].score
            }

            // y축 고정 0~100 (절대 수준이 바로 보이도록)
            const yMin = 0
            const yRange = 100

            // Canvas 그래프 렌더링
            const dpr = window.devicePixelRatio || 1
            const W = canvas.offsetWidth || canvas.parentElement.offsetWidth || 400
            const H = 130
            canvas.width  = W * dpr
            canvas.height = H * dpr
            const ctx = canvas.getContext('2d')
            ctx.scale(dpr, dpr)

            const PAD = { top: 12, right: 16, bottom: 28, left: 36 }
            const gW = W - PAD.left - PAD.right
            const gH = H - PAD.top - PAD.bottom
            const n  = points.length

            // y좌표 변환 함수
            const toY = (v) => PAD.top + gH - ((v - yMin) / yRange) * gH

            // 배경 그리드 (0~100 고정)
            ctx.strokeStyle = '#f1f3f5'
            ctx.lineWidth = 1
            ;[0, 25, 50, 75, 100].forEach(v => {
                const y = toY(v)
                ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + gW, y); ctx.stroke()
                ctx.fillStyle = '#aab0bc'
                ctx.font = '10px Pretendard, sans-serif'
                ctx.textAlign = 'right'
                ctx.fillText(v + '점', PAD.left - 4, y + 3.5)
            })

            if (n === 1) {
                const x = PAD.left + gW / 2
                const y = toY(points[0].score)
                ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2)
                ctx.fillStyle = '#78a3ea'; ctx.fill()
            } else {
                // 그라디언트 채우기
                const grad = ctx.createLinearGradient(0, PAD.top, 0, PAD.top + gH)
                grad.addColorStop(0, 'rgba(120,163,234,0.25)')
                grad.addColorStop(1, 'rgba(120,163,234,0)')
                ctx.beginPath()
                points.forEach((p, i) => {
                    const x = PAD.left + (i / (n - 1)) * gW
                    const y = toY(p.score)
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)
                })
                ctx.lineTo(PAD.left + gW, toY(yMin))
                ctx.lineTo(PAD.left, toY(yMin))
                ctx.closePath()
                ctx.fillStyle = grad; ctx.fill()

                // 선
                ctx.beginPath()
                ctx.strokeStyle = '#78a3ea'; ctx.lineWidth = 2; ctx.lineJoin = 'round'
                points.forEach((p, i) => {
                    const x = PAD.left + (i / (n - 1)) * gW
                    const y = toY(p.score)
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)
                })
                ctx.stroke()

                // 점 & 경고 표시
                points.forEach((p, i) => {
                    const x = PAD.left + (i / (n - 1)) * gW
                    const y = toY(p.score)
                    ctx.beginPath(); ctx.arc(x, y, p.alert ? 5 : 3.5, 0, Math.PI * 2)
                    ctx.fillStyle = p.alert ? '#ef4444' : '#78a3ea'; ctx.fill()
                })
            }

            // X축 시간 레이블 (10초 틱 → m:ss 표시)
            ctx.fillStyle = '#aab0bc'
            ctx.font = '10px Pretendard, sans-serif'
            ctx.textAlign = 'center'
            // 라벨 간격: 30초(3틱)마다, 데이터 많으면 1분(6틱)마다
            const labelEvery = n > 40 ? 6 : 3
            points.forEach((p, i) => {
                if (i === 0 || i === n - 1 || p.tick % labelEvery === 0) {
                    const totalSec = p.tick * 10
                    const mm = Math.floor(totalSec / 60)
                    const ss = String(totalSec % 60).padStart(2, '0')
                    const x = PAD.left + (n === 1 ? gW / 2 : (i / (n - 1)) * gW)
                    ctx.fillText(`${mm}:${ss}`, x, H - 6)
                }
            })
        }
    </script>
</body>

</html>
